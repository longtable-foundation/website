# Used by the "Deploy to DigitalOcean" button.
spec:
  name: longtable-website
  region: nyc
  static_sites:
    - name: web
      github:
        repo: longtable-foundation/website
        branch: main
        deploy_on_push: true
      environment_slug: node-js
      build_command: npm ci && npm run build
      output_dir: dist
      error_document: 404.html
      envs:
        # Google Apps Script /exec URL for sign-ups. Can also be set in src/config.js.
        - key: SHEET_ENDPOINT
          scope: BUILD_TIME
          value: ""
